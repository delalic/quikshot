<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">QuikShot development process flow</title>
  <desc id="desc">Project board states from Backlog to Ready to In progress to In review to Done, with failed review, self-merge, and follow-up loops.</desc>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A92A6"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E0A347"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34B07B"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC6A5C"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5C84F2"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <style>
      .label { font: 700 20px -apple-system, BlinkMacSystemFont, "Inter Tight", "Segoe UI", sans-serif; fill: #F0F2F8; }
      .sub { font: 400 14px -apple-system, BlinkMacSystemFont, "Inter Tight", "Segoe UI", sans-serif; fill: #B0B6C6; }
      .action { font: 600 13px -apple-system, BlinkMacSystemFont, "Inter Tight", "Segoe UI", sans-serif; fill: #B0B6C6; }
      .note { font: 400 13px -apple-system, BlinkMacSystemFont, "Inter Tight", "Segoe UI", sans-serif; fill: #B0B6C6; }
    </style>
  </defs>

  <rect x="1" y="1" width="1118" height="428" rx="28" fill="#1C2238" stroke="#3A4360" stroke-width="2"/>
  <rect x="24" y="24" width="1072" height="382" rx="22" fill="#232B45" opacity=".52"/>

  <!-- Main states -->
  <g filter="url(#soft-shadow)">
    <rect x="56" y="118" width="146" height="90" rx="18" fill="#2A2F43" stroke="#6B7388" stroke-opacity=".62"/>
    <rect x="276" y="118" width="146" height="90" rx="18" fill="#2A2F43" stroke="#6B7388" stroke-opacity=".62"/>
    <rect x="496" y="118" width="146" height="90" rx="18" fill="#3A332E" stroke="#E0A347" stroke-opacity=".72"/>
    <rect x="716" y="118" width="146" height="90" rx="18" fill="#3A332E" stroke="#E0A347" stroke-opacity=".72"/>
    <rect x="936" y="118" width="146" height="90" rx="18" fill="#243E43" stroke="#34B07B" stroke-opacity=".72"/>
  </g>

  <text class="label" x="82" y="158">Backlog</text>
  <text class="sub" x="82" y="183">Not started</text>
  <text class="label" x="310" y="158">Ready</text>
  <text class="sub" x="310" y="183">Not started</text>
  <text class="label" x="522" y="158">In progress</text>
  <text class="sub" x="522" y="183">Active coding</text>
  <text class="label" x="748" y="158">In review</text>
  <text class="sub" x="748" y="183">Active review</text>
  <text class="label" x="980" y="158">Done</text>
  <text class="sub" x="980" y="183">Accepted</text>

  <!-- Main flow arrows -->
  <path d="M 211 163 L 267 163" fill="none" stroke="#8A92A6" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text class="action" x="221" y="144">PM refines</text>

  <path d="M 431 163 L 487 163" fill="none" stroke="#8A92A6" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text class="action" x="433" y="144">Coder picks up</text>

  <path d="M 651 163 L 707 163" fill="none" stroke="#E0A347" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text class="action" x="652" y="144">Coder implements</text>
  <text class="action" x="661" y="199">or fixes review</text>

  <path d="M 871 163 L 927 163" fill="none" stroke="#E0A347" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text class="action" x="872" y="144">Reviewer approves</text>

  <!-- Failed review loop -->
  <path d="M 781 109 C 750 58 642 48 572 58 C 502 68 433 82 360 109" fill="none" stroke="#DC6A5C" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow-red)"/>
  <rect x="492" y="36" width="206" height="34" rx="17" fill="#301F29" stroke="#DC6A5C" stroke-opacity=".55"/>
  <text class="action" x="518" y="58" fill="#DC6A5C">Reviewer fails issue</text>

  <!-- Self-merge path -->
  <path d="M 580 216 C 610 276 738 294 874 282 C 946 276 987 256 1006 216" fill="none" stroke="#34B07B" stroke-width="2" stroke-dasharray="8 8" marker-end="url(#arrow-green)"/>
  <rect x="670" y="266" width="220" height="34" rx="17" fill="#1F332E" stroke="#34B07B" stroke-opacity=".55"/>
  <text class="action" x="698" y="288" fill="#34B07B">Coder self-merges</text>

  <!-- Follow-up loop -->
  <path d="M 1008 216 C 1008 360 113 360 113 216" fill="none" stroke="#5C84F2" stroke-width="2" stroke-dasharray="8 8" marker-end="url(#arrow-blue)"/>
  <rect x="438" y="330" width="246" height="34" rx="17" fill="#1E2B4A" stroke="#5C84F2" stroke-opacity=".6"/>
  <text class="action" x="465" y="352" fill="#B0C6FF">PM creates follow-up</text>

  <!-- Legend -->
  <g transform="translate(56 374)">
    <rect x="0" y="0" width="1008" height="32" rx="12" fill="#111729" stroke="#3A4360" stroke-opacity=".8"/>
    <circle cx="24" cy="16" r="5" fill="#6B7388"/>
    <text class="note" x="40" y="21">Not started</text>
    <circle cx="176" cy="16" r="5" fill="#E0A347"/>
    <text class="note" x="192" y="21">Active work</text>
    <circle cx="324" cy="16" r="5" fill="#34B07B"/>
    <text class="note" x="340" y="21">Accepted</text>
    <line x1="476" y1="16" x2="524" y2="16" stroke="#8A92A6" stroke-width="2"/>
    <text class="note" x="540" y="21">Normal path</text>
    <line x1="688" y1="16" x2="736" y2="16" stroke="#5C84F2" stroke-width="2" stroke-dasharray="8 8"/>
    <text class="note" x="752" y="21">Exception or follow-up path</text>
  </g>
</svg>
