<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc">
  <title id="title">QuikShot local lane development process</title>
  <desc id="desc">Default local issue lane from Backlog to Ready to In progress to In review to Done, with failed review, qualified self-merge, and follow-up loops.</desc>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A92A6"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E0A347"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34B07B"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC6A5C"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5C84F2"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <style>
      .eyebrow { font: 700 13px -apple-system, BlinkMacSystemFont, "Inter Tight", "Segoe UI", sans-serif; letter-spacing: .12em; fill: #B0C6FF; text-transform: uppercase; }
      .label { font: 700 20px -apple-system, BlinkMacSystemFont, "Inter Tight", "Segoe UI", sans-serif; fill: #F0F2F8; }
      .sub { font: 400 14px -apple-system, BlinkMacSystemFont, "Inter Tight", "Segoe UI", sans-serif; fill: #B0B6C6; }
      .action { font: 600 13px -apple-system, BlinkMacSystemFont, "Inter Tight", "Segoe UI", sans-serif; fill: #B0B6C6; }
      .note { font: 400 13px -apple-system, BlinkMacSystemFont, "Inter Tight", "Segoe UI", sans-serif; fill: #B0B6C6; }
      .small { font: 600 12px -apple-system, BlinkMacSystemFont, "Inter Tight", "Segoe UI", sans-serif; fill: #B0B6C6; }
    </style>
  </defs>

  <rect x="1" y="1" width="1118" height="448" rx="28" fill="#1C2238" stroke="#3A4360" stroke-width="2"/>
  <rect x="24" y="24" width="1072" height="402" rx="22" fill="#232B45" opacity=".52"/>
  <text class="eyebrow" x="56" y="60">Local lane - default</text>

  <!-- Main states -->
  <g filter="url(#soft-shadow)">
    <rect x="56" y="130" width="146" height="90" rx="18" fill="#2A2F43" stroke="#6B7388" stroke-opacity=".62"/>
    <rect x="276" y="130" width="146" height="90" rx="18" fill="#2A2F43" stroke="#6B7388" stroke-opacity=".62"/>
    <rect x="496" y="130" width="146" height="90" rx="18" fill="#3A332E" stroke="#E0A347" stroke-opacity=".72"/>
    <rect x="716" y="130" width="146" height="90" rx="18" fill="#3A332E" stroke="#E0A347" stroke-opacity=".72"/>
    <rect x="936" y="130" width="146" height="90" rx="18" fill="#243E43" stroke="#34B07B" stroke-opacity=".72"/>
  </g>

  <text class="label" x="82" y="170">Backlog</text>
  <text class="sub" x="82" y="195">PM scoped</text>
  <text class="label" x="310" y="170">Ready</text>
  <text class="sub" x="310" y="195">Codeable</text>
  <text class="label" x="522" y="170">In progress</text>
  <text class="sub" x="522" y="195">Local Coder</text>
  <text class="label" x="748" y="170">In review</text>
  <text class="sub" x="748" y="195">Reviewer</text>
  <text class="label" x="980" y="170">Done</text>
  <text class="sub" x="980" y="195">Accepted</text>

  <!-- Main flow arrows -->
  <path d="M 211 175 L 267 175" fill="none" stroke="#8A92A6" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text class="action" x="220" y="156">PM refines</text>

  <path d="M 431 175 L 487 175" fill="none" stroke="#8A92A6" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text class="action" x="430" y="156">Coder claims</text>

  <path d="M 651 175 L 707 175" fill="none" stroke="#E0A347" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text class="action" x="650" y="156">Code complete</text>
  <text class="small" x="668" y="211">PR opened</text>

  <path d="M 871 175 L 927 175" fill="none" stroke="#E0A347" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text class="action" x="872" y="156">Review passes</text>
  <text class="small" x="872" y="211">merge + install</text>

  <!-- Failed review loop -->
  <path d="M 780 120 C 748 70 642 58 572 70 C 502 82 432 94 360 120" fill="none" stroke="#DC6A5C" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow-red)"/>
  <rect x="462" y="48" width="266" height="34" rx="17" fill="#301F29" stroke="#DC6A5C" stroke-opacity=".55"/>
  <text class="action" x="494" y="70" fill="#DC6A5C">Review fails: back to Ready</text>

  <!-- Qualified self-merge path -->
  <path d="M 580 228 C 608 292 742 310 878 298 C 948 292 988 272 1006 228" fill="none" stroke="#34B07B" stroke-width="2" stroke-dasharray="8 8" marker-end="url(#arrow-green)"/>
  <rect x="650" y="282" width="260" height="34" rx="17" fill="#1F332E" stroke="#34B07B" stroke-opacity=".55"/>
  <text class="action" x="684" y="304" fill="#34B07B">Qualified self-merge path</text>

  <!-- Follow-up loop -->
  <path d="M 1008 228 C 1008 376 112 376 112 228" fill="none" stroke="#5C84F2" stroke-width="2" stroke-dasharray="8 8" marker-end="url(#arrow-blue)"/>
  <rect x="432" y="348" width="258" height="34" rx="17" fill="#1E2B4A" stroke="#5C84F2" stroke-opacity=".6"/>
  <text class="action" x="456" y="370" fill="#B0C6FF">PM creates follow-up issue</text>

  <!-- Legend -->
  <g transform="translate(56 394)">
    <rect x="0" y="0" width="1008" height="32" rx="12" fill="#111729" stroke="#3A4360" stroke-opacity=".8"/>
    <circle cx="24" cy="16" r="5" fill="#6B7388"/>
    <text class="note" x="40" y="21">Queue</text>
    <circle cx="140" cy="16" r="5" fill="#E0A347"/>
    <text class="note" x="156" y="21">Active work</text>
    <circle cx="292" cy="16" r="5" fill="#34B07B"/>
    <text class="note" x="308" y="21">Accepted</text>
    <line x1="444" y1="16" x2="492" y2="16" stroke="#8A92A6" stroke-width="2"/>
    <text class="note" x="508" y="21">Normal path</text>
    <line x1="656" y1="16" x2="704" y2="16" stroke="#5C84F2" stroke-width="2" stroke-dasharray="8 8"/>
    <text class="note" x="720" y="21">Exception or follow-up path</text>
  </g>
</svg>
